<!DOCTYPE html>

<html class="light" lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard do Médico - Agendamentos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b8cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-size: 24px;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#111418] dark:text-white transition-colors duration-300">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside
            class="w-64 border-r border-[#dbe0e6] dark:border-gray-800 bg-white dark:bg-background-dark flex flex-col justify-between p-4">
            <div class="flex flex-col gap-8">
                <!-- Profile Section -->
                <div class="flex items-center gap-3 px-2">

                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-12 border-2 border-primary/20"
                        data-alt="Doctor" style="background-image: url('{{ medico.imagem.url }}');"></div>
                    <div class="flex flex-col">
                        <h1 class="text-[#111418] dark:text-white text-base font-bold leading-tight">
                            {{request.session.medico_nome}}</h1>
                        <p class="text-[#617589] dark:text-gray-400 text-xs font-medium">
                            {{request.session.medico_especialidade}}</p>
                    </div>
                </div>
                <!-- Nav Items -->
                <nav class="flex flex-col gap-1">

                    <div
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 text-primary cursor-pointer border-l-4 border-primary">
                        <i class="fa-solid fa-calendar-day"></i>
                        <p class="text-sm font-semibold">Agendamentos</p>
                    </div>
                    <div
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#617589] hover:bg-primary/5 hover:text-primary transition-all cursor-pointer">
                        <i class="fa-solid fa-users"></i>
                        <a href="{% url 'homeMedico'%}" class="text-sm font-semibold">Home</a>
                    </div>

                    <!-- Assistant Highlight -->
                    {% include 'includes/bot.html'%}
                </nav>
            </div>
            <div class="flex flex-col gap-2">
                <div
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#617589] hover:bg-red-50 hover:text-red-500 transition-all cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <a class="text-sm font-semibold" href="{% url 'logout' %}">Sair</a>
                </div>
            </div>
        </aside>
        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
<!-- Main Content Area -->
<div class="lg:col-span-8 space-y-6">

<div class="bg-white dark:bg-[#1a242f] p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
<div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start text-center sm:text-left">
<div class="relative">


</div>
<div class="flex-1 flex flex-col justify-center">
<div class="flex items-center justify-center sm:justify-start gap-3 mb-1">
<h3 class="text-2xl font-bold">{{ paciente.nome }}</h3>
<span class="bg-primary/10 text-primary text-[10px] uppercase font-black px-2 py-0.5 rounded">Ativo</span>
</div>
<p class="text-gray-500 dark:text-gray-400 font-medium">{{paciente.dataN}} <span class="text-primary">#{{paciente.id}}64</span></p>

</div>
</div>
</div>
<!-- Form Card -->
<div class="bg-white dark:bg-[#1a242f] rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
<div class="p-6 border-b border-gray-100 dark:border-gray-800">
<h2 class="text-xl font-bold flex items-center gap-2">
<i class="fa-solid fa-vials text-primary"></i>
                                Seleção de Exames
                            </h2>
</div>
<div class="p-6">
<form method="post" action="{% url 'pedido_de_analise' consulta_id=consulta.id %}">
    {% csrf_token %}

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-1">

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Hemograma Completo">
            <span>Hemograma Completo</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Glicemia em Jejum">
            <span>Glicemia em Jejum</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Exame de Urina">
            <span>Exame de Urina</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Colesterol Total">
            <span>Colesterol Total</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Triglicerídeos">
            <span>Triglicerídeos</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Raio-X do Tórax">
            <span>Raio-X do Tórax</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Ultrassonografia Abdominal">
            <span>Ultrassonografia Abdominal</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Eletrocardiograma (ECG)">
            <span>Eletrocardiograma (ECG)</span>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer">
            <input type="checkbox" name="exames[]" value="Teste de HIV">
            <span>Teste de HIV</span>
        </label>

    </div>

    <div class="mt-8">
        <label class="block text-sm font-bold mb-2">Outros Exames ou Observações</label>
        <textarea name="observacoes" class="w-full rounded-lg border-gray-200 dark:border-gray-700 bg-background-light dark:bg-[#2d3a4a] focus:ring-primary focus:border-primary p-4 text-sm" placeholder="Descreva exames adicionais ou instruções específicas para o laboratório..." rows="4"></textarea>
    </div>

    <button type="submit" class="px-8 py-2.5 rounded-lg bg-primary text-white text-sm font-bold shadow-lg shadow-primary/30 hover:bg-primary/90 transition-all flex items-center justify-center gap-2"> <i class="fa-solid fa-paper-plane text-[18px]"></i> Enviar Pedido de Exame </button>
</form>

</div>
</div>
<!-- Assistant Sidebar -->


    
            
        </main>


    </div>
</body>

</html>
