<!DOCTYPE html>

<html class="light" lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard do Médico - Agendamentos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b8cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-size: 24px;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#111418] dark:text-white transition-colors duration-300">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside
            class="w-64 border-r border-[#dbe0e6] dark:border-gray-800 bg-white dark:bg-background-dark flex flex-col justify-between p-4">
            <div class="flex flex-col gap-8">
                <!-- Profile Section -->
                <div class="flex items-center gap-3 px-2">

                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-12 border-2 border-primary/20"
                        data-alt="Doctor" style="background-image: url('{{ medico.imagem.url }}');"></div>
                    <div class="flex flex-col">
                        <h1 class="text-[#111418] dark:text-white text-base font-bold leading-tight">
                            {{request.session.medico_nome}}</h1>
                        <p class="text-[#617589] dark:text-gray-400 text-xs font-medium">
                            {{request.session.medico_especialidade}}</p>
                    </div>
                </div>
                <!-- Nav Items -->
                <nav class="flex flex-col gap-1">

                    <div
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 text-primary cursor-pointer border-l-4 border-primary">
                        <i class="fa-solid fa-calendar-day"></i>
                        <p class="text-sm font-semibold">Agendamentos</p>
                    </div>
                    <div
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#617589] hover:bg-primary/5 hover:text-primary transition-all cursor-pointer">
                        <i class="fa-solid fa-users"></i>
                        <a href="{% url 'homeMedico'%}" class="text-sm font-semibold">Home</a>
                    </div>

                    <!-- Assistant Highlight -->
                    {% include 'includes/bot.html'%}
                </nav>
            </div>
            <div class="flex flex-col gap-2">
                <div
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#617589] hover:bg-red-50 hover:text-red-500 transition-all cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <a class="text-sm font-semibold" href="{% url 'logout' %}">Sair</a>
                </div>
            </div>
        </aside>
        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <!-- Top Navigation Bar -->
            <header
                class="flex items-center justify-between border-b border-[#dbe0e6] dark:border-gray-800 bg-white dark:bg-background-dark px-8 py-4 sticky top-0 z-10">

                <div class="flex items-center gap-4">


                </div>
            </header>
            <!-- Page Content -->
            <div class="layout-content-container flex flex-col max-w-[1024px] w-full px-6">
                <!-- PageHeading -->
                <div class="flex flex-wrap justify-between items-end gap-3 pb-8">
                    <a href="{% url 'pedido_de_analise' consulta_id=consulta.id %}"
                        class="flex h-10 items-center justify-center px-4 rounded-lg bg-primary text-white text-sm font-bold shadow-lg shadow-primary/20 hover:bg-blue-600 transition-all">
                        <i class="fa-solid fa-paper-plane mr-2 text-xl"></i> Emitir Receita Diagnóstico
                </a>
                    <form action="{% url 'examinar' paciente.id %}" method="POST">
                        {% csrf_token %}

                        <div class="flex gap-3">
                            <button
                                class="flex h-10 items-center justify-center px-4 rounded-lg border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-bold">
                                <i class="fa-solid fa-floppy-disk mr-2 text-xl"></i> Salvar
                            </button>
                        </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                    <div class="lg:col-span-2 flex flex-col gap-6">

                        <div
                            class="bg-white dark:bg-gray-900 rounded-xl border border-[#dbe0e6] dark:border-gray-800 shadow-sm p-6">
                            <h3 class="text-[#111418] dark:text-white text-lg font-bold pb-4 flex items-center">
                                Receita Médica
                            </h3>

                            <textarea name="receita"
                                class="w-full min-h-[160px] rounded-xl border-[#dbe0e6] dark:border-gray-700 dark:bg-gray-800 text-sm focus:ring-primary focus:border-primary p-4"
                                placeholder="Ex: Diclofenac, Dipirona, Paracetamol."></textarea>

                        </div>
                        <div
                            class="bg-white dark:bg-gray-900 rounded-xl border border-[#dbe0e6] dark:border-gray-800 shadow-sm p-6">
                            <h3 class="text-[#111418] dark:text-white text-lg font-bold pb-4 flex items-center">
                                <i class="fa-solid fa-spa mr-2 text-primary"></i> Recomendações de
                                Estilo de Vida e Cuidados
                            </h3>
                            <textarea name="cuidados"
                                class="w-full min-h-[160px] rounded-xl border-[#dbe0e6] dark:border-gray-700 dark:bg-gray-800 text-sm focus:ring-primary focus:border-primary p-4"
                                placeholder="Ex: Aumentar ingestão de líquidos, repouso por 2 dias, evitar alimentos gordurosos..."></textarea>
                            </form>

                        </div>
                    </div>
                    <!-- Sidebar AI Assistant -->

                </div>
                <!-- Bottom Action Bar (Mobile Responsive) -->
                <div class="mt-8 mb-12 flex justify-center">

                </div>
        </main>


    </div>
</body>

</html>
