{% load static %}
<!DOCTYPE html>

<html class="light" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Editar Perfil</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#2b8cee",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    .material-symbols-outlined.fill {
      font-variation-settings:
        'FILL' 1
    }
  </style>
</head>

<div class="header" style="margin-bottom: 20px;">

  {% include 'includes/header.html'%}
</div>

<body class="bg-background-light dark:bg-background-dark font-display">
  <div class="relative flex min-h-screen w-full">
    <!-- SideNavBar -->
    <aside class="flex flex-col w-64 bg-white dark:bg-background-dark dark:border-r dark:border-gray-800 p-4 shrink-0">
      <div class="flex flex-col gap-4">
        <div class="flex items-center gap-3 p-2">

          <div class="flex flex-col">
            <h1 class="text-[#111418] dark:text-white text-base font-semibold leading-normal">{{paciente.nome}}</h1>

          </div>
        </div>
        <nav class="flex flex-col gap-2 mt-4">

          <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-[#111418] dark:text-gray-300"
            href="{% url 'historico' %}">
            <i class="fa-solid fa-calendar-days text-xl"></i>
            <p class="text-sm font-medium leading-normal">Histórico de Agendamentos</p>
          </a>
          <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-[#111418] dark:text-gray-300"
            href="#">
            <i class="fa-solid fa-file-lines text-xl"></i>
            <p class="text-sm font-medium leading-normal">Documentos</p>
          </a>
          <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-[#111418] dark:text-gray-300"
            href="{% url 'ver_pedidos_analises' %}">
            <i class="fa-solid fa-file-lines text-xl"></i>
            <p class="text-sm font-medium leading-normal">Ver Pedidos de analise</p>
          </a>
          <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-[#111418] dark:text-gray-300"
            href="{% url 'home' %}">
            <i class="fa-solid fa-right-from-bracket text-xl"></i>
            <p class="text-sm font-medium leading-normal">Sair</p>
          </a>
        </nav>
      </div>
      <div class="mt-auto flex flex-col gap-1">
        <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-[#111418] dark:text-gray-300"
          href="#">


        </a>
      </div>
    </aside>
    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
      <div class="mx-auto max-w-4xl">
        <!-- PageHeading -->


        <!-- Content Sections -->
        <div class="mt-8 flex flex-col gap-10">
          <!-- ProfileHeader / Avatar Section -->
          <section class="flex flex-col gap-4 sm:flex-row sm:items-center">
            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-24 w-24"
              data-alt="Current profile picture of Ana Oliveira"
              style="background-image: url('{% static 'img/icone-de-paciente-saudavel_933463-51236.jpg' %}');">
            </div>
            <div class="flex flex-col">
              <p class="text-[#111418] dark:text-white text-xl font-bold">Foto de Perfil</p>
            </div>

          </section>
          <!-- Personal Information Section -->
          <section>
            <h3 class="text-[#111418] dark:text-white text-lg font-bold">Informações Pessoais</h3>

          </section>
          <!-- Contact Information Section -->
          <form action="{% url 'editeperfil' %}" method="POST">{% csrf_token %}
            <section>
              <h3 class="text-[#111418] dark:text-white text-lg font-bold">Informações de Contato</h3>
              <div class="mt-4 grid grid-cols-1 gap-6 sm:grid-cols-2">
                <label class="flex flex-col">
                  <p class="text-[#111418] dark:text-gray-300 text-sm font-medium pb-2">Nome Completo</p>
                  <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-[#dbe0e6] bg-white p-3 text-base text-[#111418] placeholder:text-[#617589] focus:border-primary focus:outline-0 focus:ring-0 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder:text-gray-400"
                    name="nome" value="{{paciente.nome}}" />
                </label>
                <label class="flex flex-col">
                  <p class="text-[#111418] dark:text-gray-300 text-sm font-medium pb-2">Endereço de e-mail</p>
                  <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-[#dbe0e6] bg-white p-3 text-base text-[#111418] placeholder:text-[#617589] focus:border-primary focus:outline-0 focus:ring-0 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder:text-gray-400"
                    name="email" type="email" value="{{paciente.email}}" />
                </label>
                <label class="flex flex-col">
                  <p class="text-[#111418] dark:text-gray-300 text-sm font-medium pb-2">Telefone</p>
                  <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-[#dbe0e6] bg-white p-3 text-base text-[#111418] placeholder:text-[#617589] focus:border-primary focus:outline-0 focus:ring-0 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder:text-gray-400"
                    name="telefone" value="{{paciente.telefone}}" />
                </label>
                <label class="flex flex-col">
                  <p class="pb-2 text-sm font-medium leading-normal text-slate-800 dark:text-slate-300">Data de
                    Nascimento</p>
                  <div class="relative flex w-full items-center">

                    <input
                      class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-primary focus:ring-primary"
                      id="data" type="date" name="dataN" />
                  </div>
                </label>
                <label class="flex flex-col">
                  <p class="text-[#111418] dark:text-gray-300 text-sm font-medium pb-2">Senha</p>
                  <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-[#dbe0e6] bg-white p-3 text-base text-[#111418] placeholder:text-[#617589] focus:border-primary focus:outline-0 focus:ring-0 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder:text-gray-400"
                    name="senha" placeholder="Introduza sua senha" />
                </label>
              </div>
              <!-- Actions Area -->
              {% for message in messages %}
              <p>{{message}}</p>
              {% endfor %}
              <div class="flex items-center justify-end gap-4 border-t border-[#e0e0e0] pt-6 dark:border-gray-700">
                <button
                  class="flex h-10 min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-transparent px-4 text-sm font-bold text-[#617589] hover:bg-[#f0f2f4] dark:text-gray-300 dark:hover:bg-gray-800">
                  <span class="truncate">Cancelar</span>
                </button>
                <button type="submit"
                  class="flex h-10 min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary px-4 text-sm font-bold text-white hover:bg-primary/90">
                  <span class="truncate">Salvar Alterações</span>
                </button>
              </div>

        </div>
      </div>
    </main>
  </div>
</body>

</html>
