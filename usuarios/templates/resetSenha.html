<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Redefinir Senha - Clínica Saúde+</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2b8cee",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
              "text-light": "#111418",
              "text-dark": "#f0f2f4",
              "text-muted-light": "#617589",
              "text-muted-dark": "#a0b3c6",
              "border-light": "#dbe0e6",
              "border-dark": "#34404c",
              "surface-light": "#ffffff",
              "surface-dark": "#1a2530",
              "success": "#28a745",
              "danger": "#dc3545",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<div class="header" style="margin-bottom: 20px;">

  {% include 'includes/header.html'%}
</div>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center py-5 sm:py-10">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1">
<header class="flex items-center justify-center whitespace-nowrap px-4 sm:px-10 py-3">
<div class="flex items-center gap-4">
<div class="h-8 w-8 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em]">Clínica Saúde+</h2>
</div>
</header>
<main class="flex flex-col items-center flex-1 px-4 py-8 sm:py-16">
<div class="w-full max-w-lg bg-surface-light dark:bg-surface-dark p-6 sm:p-10 rounded-xl shadow-sm border border-border-light dark:border-border-dark">
<div class="flex flex-col gap-3 mb-8">
<h1 class="text-text-light dark:text-text-dark text-3xl sm:text-4xl font-black leading-tight tracking-[-0.033em]">Crie sua nova senha</h1>
<p class="text-text-muted-light dark:text-text-muted-dark text-base font-normal leading-normal">Crie uma senha forte e segura para proteger sua conta.</p>
</div>
<form method="POST" action="{% url 'resetSenha' %}" class="flex flex-col gap-6">{% csrf_token %}
<div class="flex flex-col gap-4">
<label class="flex flex-col flex-1">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Nova Senha</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary h-14 placeholder:text-text-muted-light dark:placeholder:text-text-muted-dark p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Digite sua nova senha" type="password" name="senha"/>
<button aria-label="Mostrar/ocultar senha" class="text-text-muted-light dark:text-text-muted-dark flex border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark items-center justify-center px-3 rounded-r-lg border-l-0" type="button">
<i class="fa-solid fa-eye"></i>
</button>
</div>
</label>
<label class="flex flex-col flex-1">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Confirmar Nova Senha</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary h-14 placeholder:text-text-muted-light dark:placeholder:text-text-muted-dark p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Confirme sua nova senha" type="password" name="Rsenha"/>
<button aria-label="Mostrar/ocultar senha" class="text-text-muted-light dark:text-text-muted-dark flex border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark items-center justify-center px-3 rounded-r-lg border-l-0" type="button">
<i class="fa-solid fa-eye"></i>
</button>
</div>
<p class="text-danger text-sm mt-1 hidden">As senhas não coincidem.</p>
</label>
</div>
<div class="px-1 space-y-2">
<label class="flex items-center gap-x-3 text-text-muted-light dark:text-text-muted-dark">
<i class="fa-solid fa-circle-check text-base"></i>
<p class="text-sm font-normal leading-normal">Pelo menos 8 caracteres</p>
</label>
<label class="flex items-center gap-x-3 text-text-muted-light dark:text-text-muted-dark">
<i class="fa-solid fa-circle-check text-base"></i>
<p class="text-sm font-normal leading-normal">Uma letra maiúscula</p>
</label>
<label class="flex items-center gap-x-3 text-text-muted-light dark:text-text-muted-dark">
<i class="fa-solid fa-circle-check text-base"></i>
<p class="text-sm font-normal leading-normal">Uma letra minúscula</p>
</label>
<label class="flex items-center gap-x-3 text-text-muted-light dark:text-text-muted-dark">
<i class="fa-solid fa-circle-check text-base"></i>
<p class="text-sm font-normal leading-normal">Um número</p>
</label>
<label class="flex items-center gap-x-3 text-text-muted-light dark:text-text-muted-dark">
<i class="fa-solid fa-circle-check text-base"></i>
<p class="text-sm font-normal leading-normal">Um caractere especial (!@#$%)</p>
</label>
</div>
<button class="flex items-center justify-center text-center font-bold text-base h-14 px-6 py-4 rounded-lg bg-primary text-white w-full mt-4 disabled:bg-primary/50 disabled:cursor-not-allowed" type="submit">
                Salvar Nova Senha
            </button>
</form>
</div>
<footer class="text-center mt-8">
<a class="text-primary hover:underline text-sm font-medium" href="{% url 'login' %}">Voltar para o Login</a>
</footer>
</main>
</div>
</div>
</div>
</div>
</body></html>
